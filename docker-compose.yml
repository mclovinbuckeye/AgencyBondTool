services:
  bond-tool:
    image: agency-bond-tool:v1.2.0

    volumes:
      - ./input:/app/input
      - ./processed:/app/processed
      - ./unmatched:/app/unmatched
      - ./output:/app/output
      - ./reference:/app/reference
      - ./config.json:/app/config.json:ro
      - ./secrets:/app/secrets

    command: ["python", "bond_processor.py", "process"]

    environment:
      SALESFORCE_REFRESH_TOKEN_FILE: /app/secrets/salesforce_refresh_token.txt